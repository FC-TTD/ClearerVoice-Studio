services:
  clearervoice-studio:
    container_name: clearervoice-studio
    build: .
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - /tmp/clear-voice:/app/temp
    environment:
      - TZ=Asia/Shanghai
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=8501
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]