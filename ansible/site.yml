---
- name: Deploy ClearerVoice Studio
  hosts: all
  become: true
  vars:
    app_name: "clearervoice-studio"
    deploy_dir: "/opt/{{ app_name }}"
    docker_compose_file: "docker-compose.yml"
    
  tasks:
    - name: Create deployment directory
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: '0755'
      tags: [deploy, stage, prod]

    - name: Create temp directory for uploads
      file:
        path: "/tmp/clear-voice"
        state: directory
        mode: '0755'
      tags: [deploy, stage, prod]

    - name: Copy required files
      copy:
        src: "{{ item.src }}"
        dest: "{{ deploy_dir }}/{{ item.dest }}"
        mode: '0644'
      loop:
        - { src: "../docker-compose.yml", dest: "docker-compose.yml" }
        - { src: "../Dockerfile", dest: "Dockerfile" }
        - { src: "../requirements.txt", dest: "requirements.txt" }
      tags: [deploy, config, stage, prod]

    - name: Copy application directories
      synchronize:
        src: "{{ item }}"
        dest: "{{ deploy_dir }}/"
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=__pycache__"
          - "--exclude=.pytest_cache"
      loop:
        - "../clearvoice"
      delegate_to: localhost
      become: false
      tags: [deploy, app, stage, prod]

    - name: Pull latest images and recreate containers
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        build: always
        pull: always
        remove_orphans: yes
        state: present
      environment:
        COMPOSE_DOCKER_CLI_BUILD: "1"
        DOCKER_BUILDKIT: "1"
      tags: [deploy, docker, stage, prod]

    - name: Verify containers are running
      community.docker.docker_container_info:
        name: "{{ app_name }}"
      register: container_info
      tags: [deploy, docker, stage, prod]

    - name: Display deployment status
      debug:
        msg: "ClearerVoice Studio deployed to {{ deploy_dir }} and containers started successfully"
      tags: [deploy, stage, prod]
